name: 回归测试

# 对应 quiz07.md 第 6 条：使用 Actions 进行回归测试
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  regression:
    name: 退出回归测试 (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行回归测试
        env:
          # CI 上不依赖 MySQL：显式使用工程内置的 SQLite 回退库
          DB_URL: sqlite:///ci_book_borrow.db
        run: pytest -v tests/

      - name: 冒烟测试（启动应用并访问首页）
        env:
          DB_URL: sqlite:///ci_book_borrow.db
        run: |
          python -c "
          import app
          client = app.app.test_client()
          r = client.get('/')
          assert r.status_code == 200, r.status_code
          assert '图书借阅系统-后台管理' in r.get_data(as_text=True)
          print('首页访问正常')
          "